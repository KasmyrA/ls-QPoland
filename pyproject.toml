[project]
name = "quantum-scheduling"
version = "0.1.0"
description = "QUBO-based job scheduling with simulated annealing and QAOA"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.12",
    "pandas>=3.0.5",
    "matplotlib>=3.8",
    "dimod>=0.12",
    "dwave-neal>=0.6",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.13",
    "veloxq-sdk>=1.1.0",
    "pytest>=9.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 99
